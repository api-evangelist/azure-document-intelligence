  parameters:
    DocumentClassifierAnalyzeRequestParams.split:
      name: split
      in: query
      description: Document splitting mode.
      required: false
      x-ms-enum:
        name: SplitMode
        modelAsString: true
        values:
        - name: auto
          value: auto
          description: Automatically split file into documents.
        - name: none
          value: none
          description: Treat the entire file as a single document.
        - name: perPage
          value: perPage
          description: Treat each page in the file as a separate document.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - auto
        - none
        - perPage
        default: none
    DocumentClassifierAnalyzeRequestParams.stringIndexType:
      name: stringIndexType
      in: query
      description: Method used to compute string offset and length.
      required: false
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - name: textElements
          value: textElements
          description: 'User-perceived display character, or grapheme cluster, as defined by Unicode

            8.0.0.'
        - name: unicodeCodePoint
          value: unicodeCodePoint
          description: Character unit represented by a single unicode code point.  Used by Python 3.
        - name: utf16CodeUnit
          value: utf16CodeUnit
          description: 'Character unit represented by a 16-bit Unicode code unit.  Used by JavaScript,

            Java, and .NET.'
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - textElements
        - unicodeCodePoint
        - utf16CodeUnit
        default: textElements
    Azure.Core.ClientRequestIdHeader:
      name: x-ms-client-request-id
      in: header
      description: An opaque, globally-unique, client-generated string identifier for the request.
      required: false
      x-ms-parameter-location: method
      x-ms-client-name: clientRequestId
      schema:
        type: string
        format: uuid
    AnalyzeFromStreamRequestParams.input:
      name: input
      in: body
      description: Input content.
      required: true
      schema:
        type: string
        format: binary
      x-ms-parameter-location: method
    DocumentClassifierAnalyzeRequestParams.pages:
      name: pages
      in: query
      description: 1-based page numbers to analyze.  Ex. "1-3,5,7-9"
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(\d+(-\d+)?)(,\s*(\d+(-\d+)?))*$
    DocumentClassifierAnalyzeRequestParams.classifierId:
      name: classifierId
      in: path
      description: Unique document classifier name.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
