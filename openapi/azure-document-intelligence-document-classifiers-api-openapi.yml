openapi: 3.2.0
info:
  title: Document Intelligence (formerly Form Recognizer) Document…
  version: '2024-11-30'
  description: Extracts content, layout, and structured data from documents.
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- ApiKeyAuth: []
- OAuth2Auth:
  - https://cognitiveservices.azure.com/.default
tags:
- name: Document Classifiers
paths:
  /documentClassifiers:
    get:
      operationId: DocumentClassifiers_ListClassifiers
      description: List all document classifiers.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDocumentClassifierDetails'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Get Document Classifiers:
          $ref: ./examples/GetDocumentClassifiers.json
      x-ms-pageable:
        nextLinkName: nextLink
      tags:
      - Document Classifiers
      summary: Document classifiers list classifiers
      x-summary-source: derived
  /documentClassifiers/{classifierId}:
    get:
      operationId: DocumentClassifiers_GetClassifier
      description: Gets detailed document classifier information.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: classifierId
        in: path
        description: Unique document classifier name.
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentClassifierDetails'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Get Document Classifier:
          $ref: ./examples/GetDocumentClassifier.json
      tags:
      - Document Classifiers
      summary: Document classifiers get classifier
      x-summary-source: derived
    delete:
      operationId: DocumentClassifiers_DeleteClassifier
      description: Deletes document classifier.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: classifierId
        in: path
        description: Unique document classifier name.
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier for the request.
              schema:
                type: string
                format: uuid
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Delete Document Classifier:
          $ref: ./examples/DeleteDocumentClassifier.json
      tags:
      - Document Classifiers
      summary: Document classifiers delete classifier
      x-summary-source: derived
  /documentClassifiers/{classifierId}:analyze:
    post:
      operationId: DocumentClassifiers_ClassifyDocumentFromStream
      description: Classifies document with document classifier.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/DocumentClassifierAnalyzeRequestParams.classifierId'
      - $ref: '#/components/parameters/DocumentClassifierAnalyzeRequestParams.stringIndexType'
      - $ref: '#/components/parameters/DocumentClassifierAnalyzeRequestParams.split'
      - $ref: '#/components/parameters/DocumentClassifierAnalyzeRequestParams.pages'
      - $ref: '#/components/parameters/AnalyzeFromStreamRequestParams.input'
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Operation-Location:
              description: The location of an instance of AnalyzeOperation
              schema:
                type: string
                format: uri
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Classify Document from Url:
          $ref: ./examples/ClassifyDocument_Stream.json
      x-ms-long-running-operation: true
      tags:
      - Document Classifiers
      summary: Document classifiers classify document from stream
      x-summary-source: derived
  /documentClassifiers/{classifierId}:copyTo:
    post:
      operationId: DocumentClassifiers_CopyClassifierTo
      description: Copies document classifier to the target resource, region, and classifierId.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: classifierId
        in: path
        description: Unique document classifier name.
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Operation-Location:
              description: The location of an instance of DocumentClassifierCopyToOperationDetails
              schema:
                type: string
                format: uri
            Retry-After:
              description: The Retry-After header can indicate how long the client should wait before polling the operation status.
              schema:
                type: integer
                format: int32
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Copy Document Classifier To:
          $ref: ./examples/CopyDocumentClassifierTo.json
      x-ms-long-running-operation: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifierCopyAuthorization'
        description: Copy to request parameters.
        required: true
      tags:
      - Document Classifiers
      summary: Document classifiers copy classifier to
      x-summary-source: derived
  /documentClassifiers/{classifierId}/analyzeResults/{resultId}:
    get:
      operationId: DocumentClassifiers_GetClassifyResult
      description: Gets the result of document classifier.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: classifierId
        in: path
        description: Unique document classifier name.
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      - name: resultId
        in: path
        description: Analyze operation result ID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeOperation'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Get Classify Document Result:
          $ref: ./examples/GetClassifyDocumentResult.json
      tags:
      - Document Classifiers
      summary: Document classifiers get classify result
      x-summary-source: derived
components:
  schemas:
    DocumentLine:
      type: object
      description: 'A content line object consisting of an adjacent sequence of content elements,

        such as words and selection marks.'
      properties:
        content:
          type: string
          description: Concatenated content of the contained elements in reading order.
        polygon:
          type: array
          description: 'Bounding polygon of the line, with coordinates specified relative to the

            top-left of the page. The numbers represent the x, y values of the polygon

            vertices, clockwise from the left (-180 degrees inclusive) relative to the

            element orientation.'
          items:
            type: number
            format: float
        spans:
          type: array
          description: Location of the line in the reading order concatenated content.
          items:
            $ref: '#/components/schemas/DocumentSpan'
      required:
      - content
      - spans
    BoundingRegion:
      type: object
      description: Bounding polygon on a specific page of the input.
      properties:
        pageNumber:
          type: integer
          format: int32
          description: 1-based page number of page containing the bounding region.
          minimum: 1
        polygon:
          type: array
          description: 'Bounding polygon on the page, or the entire page if not specified.

            Coordinates specified relative to the top-left of the page. The numbers

            represent the x, y values of the polygon vertices, clockwise from the left

            (-180 degrees inclusive) relative to the element orientation.'
          items:
            type: number
            format: float
      required:
      - pageNumber
      - polygon
    DocumentLanguage:
      type: object
      description: An object representing the detected language for a given text span.
      properties:
        locale:
          type: string
          description: 'Detected language.  Value may an ISO 639-1 language code (ex. "en", "fr")

            or BCP 47 language tag (ex. "zh-Hans").'
        spans:
          type: array
          description: 'Location of the text elements in the concatenated content the language applies

            to.'
          items:
            $ref: '#/components/schemas/DocumentSpan'
        confidence:
          type: number
          format: float
          description: Confidence of correctly identifying the language.
          minimum: 0
          maximum: 1
      required:
      - locale
      - spans
      - confidence
    DocumentIntelligenceOperationStatus:
      type: string
      description: Operation status.
      enum:
      - notStarted
      - running
      - failed
      - succeeded
      - canceled
      - skipped
      x-ms-enum:
        name: DocumentIntelligenceOperationStatus
        modelAsString: true
        values:
        - name: notStarted
          value: notStarted
          description: The operation has not started yet.
        - name: running
          value: running
          description: The operation is in progress.
        - name: failed
          value: failed
          description: The operation has failed.
        - name: succeeded
          value: succeeded
          description: The operation has succeeded.
        - name: canceled
          value: canceled
          description: The operation has been canceled.
        - name: skipped
          value: skipped
          description: The operation has been skipped.
    DocumentIntelligenceError:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this reported error.
          items:
            $ref: '#/components/schemas/DocumentIntelligenceError'
        innererror:
          $ref: '#/components/schemas/DocumentIntelligenceInnerError'
          description: An object containing more specific information than the current object about the error.
      required:
      - code
      - message
    AnalyzedDocument:
      type: object
      description: An object describing the location and semantic content of a document.
      properties:
        docType:
          type: string
          description: Document type.
          minLength: 2
          maxLength: 64
        boundingRegions:
          type: array
          description: Bounding regions covering the document.
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          type: array
          description: Location of the document in the reading order concatenated content.
          items:
            $ref: '#/components/schemas/DocumentSpan'
        fields:
          type: object
          description: Dictionary of named field values.
          additionalProperties:
            $ref: '#/components/schemas/DocumentField'
        confidence:
          type: number
          format: float
          description: Confidence of correctly extracting the document.
          minimum: 0
          maximum: 1
      required:
      - docType
      - spans
      - confidence
    DocumentClassifierDetails:
      type: object
      description: Document classifier info.
      properties:
        classifierId:
          type: string
          description: Unique document classifier name.
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
          x-ms-mutability:
          - read
          - create
        description:
          type: string
          description: Document classifier description.
          maxLength: 4096
        createdDateTime:
          type: string
          format: date-time
          description: Date and time (UTC) when the document classifier was created.
        expirationDateTime:
          type: string
          format: date-time
          description: Date and time (UTC) when the document classifier will expire.
        modifiedDateTime:
          type: string
          format: date-time
          description: Date and time (UTC) when the document model was last modified.
          readOnly: true
        apiVersion:
          type: string
          description: API version used to create this document classifier.
        baseClassifierId:
          type: string
          description: Base classifierId on top of which the classifier was trained.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
        docTypes:
          type: object
          description: List of document types to classify against.
          additionalProperties:
            $ref: '#/components/schemas/ClassifierDocumentTypeDetails'
        warnings:
          type: array
          description: List of warnings encountered while building the classifier.
          items:
            $ref: '#/components/schemas/DocumentIntelligenceWarning'
      required:
      - classifierId
      - createdDateTime
      - apiVersion
      - docTypes
    DocumentTableCell:
      type: object
      description: An object representing the location and content of a table cell.
      properties:
        kind:
          type: string
          description: Table cell kind.
          default: content
          enum:
          - content
          - rowHeader
          - columnHeader
          - stubHead
          - description
          x-ms-enum:
            name: DocumentTableCellKind
            modelAsString: true
            values:
            - name: content
              value: content
              description: Contains the main content/data.
            - name: rowHeader
              value: rowHeader
              description: Describes the content of the row.
            - name: columnHeader
              value: columnHeader
              description: Describes the content of the column.
            - name: stubHead
              value: stubHead
              description: Describes the row headers, usually located at the top left corner of a table.
            - name: description
              value: description
              description: Describes the content in (parts of) the table.
        rowIndex:
          type: integer
          format: int32
          description: Row index of the cell.
        columnIndex:
          type: integer
          format: int32
          description: Column index of the cell.
        rowSpan:
          type: integer
          format: int32
          description: Number of rows spanned by this cell.
          default: 1
          minimum: 1
        columnSpan:
          type: integer
          format: int32
          description: Number of columns spanned by this cell.
          default: 1
          minimum: 1
        content:
          type: string
          description: Concatenated content of the table cell in reading order.
        boundingRegions:
          type: array
          description: Bounding regions covering the table cell.
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          type: array
          description: Location of the table cell in the reading order concatenated content.
          items:
            $ref: '#/components/schemas/DocumentSpan'
        elements:
          type: array
          description: Child elements of the table cell.
          items:
            $ref: '#/components/schemas/DocumentElement'
      required:
      - rowIndex
      - columnIndex
      - content
      - spans
    DocumentElement:
      type: string
      description: 'An JSON pointer referencing an element of the document, such as paragraph,

        table, section, etc.'
    DocumentTable:
      type: object
      description: A table object consisting table cells arranged in a rectangular layout.
      properties:
        rowCount:
          type: integer
          format: int32
          description: Number of rows in the table.
          minimum: 1
        columnCount:
          type: integer
          format: int32
          description: Number of columns in the table.
          minimum: 1
        cells:
          type: array
          description: Cells contained within the table.
          items:
            $ref: '#/components/schemas/DocumentTableCell'
        boundingRegions:
          type: array
          description: Bounding regions covering the table.
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          type: array
          description: Location of the table in the reading order concatenated content.
          items:
            $ref: '#/components/schemas/DocumentSpan'
        caption:
          $ref: '#/components/schemas/DocumentCaption'
          description: Caption associated with the table.
        footnotes:
          type: array
          description: List of footnotes associated with the table.
          items:
            $ref: '#/components/schemas/DocumentFootnote'
      required:
      - rowCount
      - columnCount
      - cells
      - spans
    PagedDocumentClassifierDetails:
      type: object
      description: Paged collection of DocumentClassifierDetails items
      properties:
        value:
          type: array
          description: The DocumentClassifierDetails items on this page
          items:
            $ref: '#/components/schemas/DocumentClassifierDetails'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    AddressValue:
      type: object
      description: Address field value.
      properties:
        houseNumber:
          type: string
          description: House or building number.
        poBox:
          type: string
          description: Post office box number.
        road:
          type: string
          description: Street name.
        city:
          type: string
          description: Name of city, town, village, etc.
        state:
          type: string
          description: First-level administrative division.
        postalCode:
          type: string
          description: Postal code used for mail sorting.
        countryRegion:
          type: string
          description: Country/region.
        streetAddress:
          type: string
          description: Street-level address, excluding city, state, countryRegion, and postalCode.
        unit:
          type: string
          description: Apartment or office number
        cityDistrict:
          type: string
          description: 'Districts or boroughs within a city, such as Brooklyn in New York City or City

            of Westminster in London.'
        stateDistrict:
          type: string
          description: Second-level administrative division used in certain locales.
        suburb:
          type: string
          description: Unofficial neighborhood name, like Chinatown.
        house:
          type: string
          description: Build name, such as World Trade Center.
        level:
          type: string
          description: Floor number, such as 3F.
    DocumentFontWeight:
      type: string
      description: Font weight.
      enum:
      - normal
      - bold
      x-ms-enum:
        name: DocumentFontWeight
        modelAsString: true
        values:
        - name: normal
          value: normal
          description: Characters are represented normally.
        - name: bold
          value: bold
          description: Characters are represented with thicker strokes.
    DocumentBarcodeKind:
      type: string
      description: Barcode kind.
      enum:
      - QRCode
      - PDF417
      - UPCA
      - UPCE
      - Code39
      - Code128
      - EAN8
      - EAN13
      - DataBar
      - Code93
      - Codabar
      - DataBarExpanded
      - ITF
      - MicroQRCode
      - Aztec
      - DataMatrix
      - MaxiCode
      x-ms-enum:
        name: DocumentBarcodeKind
        modelAsString: true
        values:
        - name: QRCode
          value: QRCode
          description: QR code, as defined in ISO/IEC 18004:2015.
        - name: PDF417
          value: PDF417
          description: PDF417, as defined in ISO 15438.
        - name: UPCA
          value: UPCA
          description: GS1 12-digit Universal Product Code.
        - name: UPCE
          value: UPCE
          description: GS1 6-digit Universal Product Code.
        - name: Code39
          value: Code39
          description: Code 39 barcode, as defined in ISO/IEC 16388:2007.
        - name: Code128
          value: Code128
          description: Code 128 barcode, as defined in ISO/IEC 15417:2007.
        - name: EAN8
          value: EAN8
          description: GS1 8-digit International Article Number (European Article Number).
        - name: EAN13
          value: EAN13
          description: GS1 13-digit International Article Number (European Article Number).
        - name: DataBar
          value: DataBar
          description: GS1 DataBar barcode.
        - name: Code93
          value: Code93
          description: Code 93 barcode, as defined in ANSI/AIM BC5-1995.
        - name: Codabar
          value: Codabar
          description: Codabar barcode, as defined in ANSI/AIM BC3-1995.
        - name: DataBarExpanded
          value: DataBarExpanded
          description: GS1 DataBar Expanded barcode.
        - name: ITF
          value: ITF
          description: Interleaved 2 of 5 barcode, as defined in ANSI/AIM BC2-1995.
        - name: MicroQRCode
          value: MicroQRCode
          description: Micro QR code, as defined in ISO/IEC 23941:2022.
        - name: Aztec
          value: Aztec
          description: Aztec code, as defined in ISO/IEC 24778:2008.
        - name: DataMatrix
          value: DataMatrix
          description: Data matrix code, as defined in ISO/IEC 16022:2006.
        - name: MaxiCode
          value: MaxiCode
          description: MaxiCode, as defined in ISO/IEC 16023:2000.
    DocumentSignatureType:
      type: string
      description: Presence of signature.
      enum:
      - signed
      - unsigned
      x-ms-enum:
        name: DocumentSignatureType
        modelAsString: true
        values:
        - name: signed
          value: signed
          description: A signature is detected.
        - name: unsigned
          value: unsigned
          description: No signatures are detected.
    DocumentContentFormat:
      type: string
      description: Format of the content in analyzed result.
      enum:
      - text
      - markdown
      x-ms-enum:
        name: DocumentContentFormat
        modelAsString: true
        values:
        - name: text
          value: text
          description: Plain text representation of the document content without any formatting.
        - name: markdown
          value: markdown
          description: 'Markdown representation of the document content with section headings, tables,

            etc.'
    DocumentField:
      type: object
      description: An object representing the content and location of a field value.
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldType'
          description: Data type of the field value.
        valueString:
          type: string
          description: String value.
        valueDate:
          type: string
          format: date
          description: Date value in YYYY-MM-DD format (ISO 8601).
        valueTime:
          type: string
          format: time
          description: Time value in hh:mm:ss format (ISO 8601).
        valuePhoneNumber:
          type: string
          description: Phone number value in E.164 format (ex. +19876543210).
        valueNumber:
          type: number
          format: double
          description: Floating point value.
        valueInteger:
          type: integer
          format: int64
          description: Integer value.
        valueSelectionMark:
          $ref: '#/components/schemas/DocumentSelectionMarkState'
          description: Selection mark value.
        valueSignature:
          $ref: '#/components/schemas/DocumentSignatureType'
          description: Presence of signature.
        valueCountryRegion:
          type: string
          description: 3-letter country code value (ISO 3166-1 alpha-3).
        valueArray:
          type: array
          description: Array of field values.
          items:
            $ref: '#/components/schemas/DocumentField'
        valueObject:
          type: object
          description: Dictionary of named field values.
          additionalProperties:
            $ref: '#/components/schemas/DocumentField'
        valueCurrency:
          $ref: '#/components/schemas/CurrencyValue'
          description: Currency value.
        valueAddress:
          $ref: '#/components/schemas/AddressValue'
          description: Address value.
        valueBoolean:
          type: boolean
          description: Boolean value.
        valueSelectionGroup:
          type: array
          description: Selection group value.
          items:
            type: string
        content:
          type: string
          description: Field content.
        boundingRegions:
          type: array
          description: Bounding regions covering the field.
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          type: array
          description: Location of the field in the reading order concatenated content.
          items:
            $ref: '#/components/schemas/DocumentSpan'
        confidence:
          type: number
          format: float
          description: Confidence of correctly extracting the field.
          minimum: 0
          maximum: 1
      required:
      - type
    StringIndexType:
      type: string
      description: Method used to compute string offset and length.
      enum:
      - textElements
      - unicodeCodePoint
      - utf16CodeUnit
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - name: textElements
          value: textElements
          description: 'User-perceived display character, or grapheme cluster, as defined by Unicode

            8.0.0.'
        - name: unicodeCodePoint
          value: unicodeCodePoint
          description: Character unit represented by a single unicode code point.  Used by Python 3.
        - name: utf16CodeUnit
          value: utf16CodeUnit
          description: 'Character unit represented by a 16-bit Unicode code unit.  Used by JavaScript,

            Java, and .NET.'
    DocumentSelectionMarkState:
      type: string
      description: State of the selection mark.
      enum:
      - selected
      - unselected
      x-ms-enum:
        name: DocumentSelectionMarkState
        modelAsString: true
        values:
        - name: selected
          value: selected
          description: 'The selection mark is selected, often indicated by a check ✓ or cross X inside

            the selection mark.'
        - name: unselected
          value: unselected
          description: The selection mark is not selected.
    DocumentFormula:
      type: object
      description: A formula object.
      properties:
        kind:
          $ref: '#/components/schemas/DocumentFormulaKind'
          description: Formula kind.
