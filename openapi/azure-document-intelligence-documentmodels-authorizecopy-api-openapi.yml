tags:
- name: DocumentModels:authorizeCopy
paths:
  /documentModels:authorizeCopy:
    post:
      operationId: DocumentModels_AuthorizeModelCopy
      description: 'Generates authorization to copy a document model to this location with

        specified modelId and optional description.'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCopyAuthorization'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntelligenceErrorResponse'
      x-ms-examples:
        Authorize Copy of Document Model:
          $ref: ./examples/AuthorizeCopyDocumentModel.json
      tags:
      - DocumentModels:authorizeCopy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeCopyRequest'
        description: Authorize copy request parameters.
        required: true
components:
  schemas:
    AuthorizeCopyRequest:
      type: object
      description: Request body to authorize document model copy.
      properties:
        modelId:
          type: string
          description: Unique document model name.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
        description:
          type: string
          description: Document model description.
          maxLength: 4096
        tags:
          type: object
          description: List of key-value tag attributes associated with the document model.
          additionalProperties:
            type: string
      required:
      - modelId
    ModelCopyAuthorization:
      type: object
      description: 'Authorization to copy a document model to the specified target resource and

        modelId.'
      properties:
        targetResourceId:
          type: string
          description: ID of the target Azure resource where the document model should be copied to.
        targetResourceRegion:
          type: string
          description: 'Location of the target Azure resource where the document model should be copied

            to.'
        targetModelId:
          type: string
          description: Identifier of the target document model.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
        targetModelLocation:
          type: string
          format: uri
          description: URL of the copied document model in the target account.
        accessToken:
          type: string
          description: Token used to authorize the request.
        expirationDateTime:
          type: string
          format: date-time
          description: Date/time when the access token expires.
      required:
      - targetResourceId
      - targetResourceRegion
      - targetModelId
      - targetModelLocation
      - accessToken
      - expirationDateTime
    DocumentIntelligenceError:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this reported error.
          items:
            $ref: '#/components/schemas/DocumentIntelligenceError'
        innererror:
          $ref: '#/components/schemas/DocumentIntelligenceInnerError'
          description: An object containing more specific information than the current object about the error.
      required:
      - code
      - message
    DocumentIntelligenceErrorResponse:
      type: object
      description: Error response object.
      properties:
        error:
          $ref: '#/components/schemas/DocumentIntelligenceError'
          description: Error info.
      required:
      - error
    DocumentIntelligenceInnerError:
      type: object
      description: An object containing more specific information about the error.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        innererror:
          $ref: '#/components/schemas/DocumentIntelligenceInnerError'
          description: Inner error.
  parameters:
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            https://cognitiveservices.azure.com/.default: ''
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/token
