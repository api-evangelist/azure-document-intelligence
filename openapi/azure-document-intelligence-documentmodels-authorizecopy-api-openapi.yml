definitions:
  ModelCopyAuthorization:
    type: object
    description: 'Authorization to copy a document model to the specified target resource and

      modelId.'
    properties:
      targetResourceId:
        type: string
        description: ID of the target Azure resource where the document model should be copied to.
      targetResourceRegion:
        type: string
        description: 'Location of the target Azure resource where the document model should be copied

          to.'
      targetModelId:
        type: string
        description: Identifier of the target document model.
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      targetModelLocation:
        type: string
        format: uri
        description: URL of the copied document model in the target account.
      accessToken:
        type: string
        description: Token used to authorize the request.
      expirationDateTime:
        type: string
        format: date-time
        description: Date/time when the access token expires.
    required:
    - targetResourceId
    - targetResourceRegion
    - targetModelId
    - targetModelLocation
    - accessToken
    - expirationDateTime
  DocumentIntelligenceErrorResponse:
    type: object
    description: Error response object.
    properties:
      error:
        $ref: '#/definitions/DocumentIntelligenceError'
        description: Error info.
    required:
    - error
  DocumentIntelligenceInnerError:
    type: object
    description: An object containing more specific information about the error.
    properties:
      code:
        type: string
        description: One of a server-defined set of error codes.
      message:
        type: string
        description: A human-readable representation of the error.
      innererror:
        $ref: '#/definitions/DocumentIntelligenceInnerError'
        description: Inner error.
  AuthorizeCopyRequest:
    type: object
    description: Request body to authorize document model copy.
    properties:
      modelId:
        type: string
        description: Unique document model name.
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
      description:
        type: string
        description: Document model description.
        maxLength: 4096
      tags:
        type: object
        description: List of key-value tag attributes associated with the document model.
        additionalProperties:
          type: string
    required:
    - modelId
  DocumentIntelligenceError:
    type: object
    description: The error object.
    properties:
      code:
        type: string
        description: One of a server-defined set of error codes.
      message:
        type: string
        description: A human-readable representation of the error.
      target:
        type: string
        description: The target of the error.
      details:
        type: array
        description: An array of details about specific errors that led to this reported error.
        items:
          $ref: '#/definitions/DocumentIntelligenceError'
      innererror:
        $ref: '#/definitions/DocumentIntelligenceInnerError'
        description: An object containing more specific information than the current object about the error.
    required:
