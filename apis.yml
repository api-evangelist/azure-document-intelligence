aid: azure-document-intelligence
url: https://azure.microsoft.com/en-us/products/ai-services/ai-document-intelligence
name: Azure AI Document Intelligence
kind: company
description: >-
  Azure AI Document Intelligence (formerly Form Recognizer) is Microsoft's cloud document understanding service. It
  exposes prebuilt models for invoices, receipts, IDs, business cards, tax forms and contracts, plus a layout/OCR Read
  model and a Custom-model framework for fine-tuned extraction. The 2024- 11-30 GA REST API is the current stable
  surface; preview APIs add Custom Generative Extraction.
