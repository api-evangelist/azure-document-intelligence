description: >-
  Azure AI Document Intelligence offers a Free tier (F0) and a pay-as-you-go
  Standard tier (S0) with per-page rates that vary by model. Commitment tiers
  unlock prepay discounts for larger workloads. Billing is per page processed,
  with separate rates for OCR (Read), Prebuilt models, Custom Classification
  and Custom Extraction, plus add-on capabilities and Query Fields.
notes: >-
  Prices reflect the public azure.microsoft.com/pricing page as of 2026-05-08.
  Rates may vary by Azure region. Free tier excludes premium features.
sources:
- https://azure.microsoft.com/en-us/pricing/details/document-intelligence/
- https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/service-limits
