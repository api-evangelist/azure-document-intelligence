specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Azure AI Document Intelligence
providerId: azure-document-intelligence
created: '2026-05-08'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-08, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-08'
reconciled: true
tags:
- AI
- Document AI
- Azure
- IDP
- OCR
- Rate Limiting
- Quotas
- Throttling
description: >-
  Azure AI Document Intelligence enforces tier-specific transactions per
  second (TPS) ceilings. F0 (Free) is capped at 1 transaction per second; S0
  (Standard) defaults to 15 TPS and can be raised on request via Azure
  support. Per-document size caps and per-call page caps depend on model and
  API version.
notes: >-
  TPS includes both submit (analyze) and result-polling calls. Document size
  limit is 500 MB / 2,000 pages on S0 paid; F0 has lower caps. See Microsoft
  Learn service-limits doc for current per-version caps.
sources:
- https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/service-limits
- https://docs.azure.cn/en-us/ai-services/document-intelligence/service-limits
responseCodes:
  throttled: 429
headers:
- name: Retry-After
  description: Seconds to wait before retrying.
- name: x-ms-ratelimit-remaining-requests
  description: Remaining requests within current window (when present).
limits:
- name: Free (F0) TPS
  scope: resource
  metric: tps
  limit: 1
  timeFrame: 1s
- name: Standard (S0) TPS
  scope: resource
  metric: tps
  limit: 15
  timeFrame: 1s
  notes: Default; can be increased via Azure support.
- name: Maximum document size (Standard)
  scope: request
  metric: MB
  limit: 500
- name: Maximum pages per document (Standard)
  scope: request
  metric: pages
  limit: 2000
policies:
- name: Backoff Strategy
  description: Honor 429 with Retry-After; use exponential backoff. Polling for analyze-result should follow the documented Operation-Location header cadence.
- name: Quota Increases
  description: Submit Azure support ticket to raise TPS or training-job concurrency on S0.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
