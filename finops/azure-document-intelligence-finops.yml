specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Azure AI Document Intelligence
providerId: azure-document-intelligence
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- AI
- Document AI
- Azure
- IDP
- OCR
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for Azure AI Document Intelligence. Costs are
  Azure-billed per-page consumption against tier-specific rates (Read,
  Prebuilt, Custom Classification, Custom Extraction, Add-Ons, Query Fields)
  plus optional commitment tiers. Standard Azure cost-management plumbing
  applies — resource group / subscription / tag-based allocation through
  Azure Cost Management + Microsoft Cost Management exports (FOCUS-native).
notes: >-
  Azure publishes a FOCUS-conformant cost export, so allocation by
  ResourceTag is straightforward. Add-ons and Query Fields are billed on top
  of the base prebuilt/custom rates and easy to overlook.
sources:
- https://azure.microsoft.com/en-us/pricing/details/document-intelligence/
- https://learn.microsoft.com/en-us/azure/cost-management-billing/dataset-schema/cost-usage-details-focus
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Microsoft
serviceCategory: AI / IDP
billingModel:
  pricingCategory: Usage (per-page) + optional Commitment
  billingFrequency: Monthly
  billingCurrency: USD (varies by Azure billing currency)
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Azure AI Document Intelligence
  ServiceCategory: AI Services
  ProviderName: Microsoft
  PublisherName: Microsoft
  InvoiceIssuerName: Microsoft
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingUnit: 1K pages
meters:
- name: read_pages
  description: OCR (Read model) pages.
  unit: page
  aggregation: sum
  dimensions:
  - resource
  - region
- name: prebuilt_pages
  description: Prebuilt-model pages (Invoice / Receipt / ID / etc.).
  unit: page
  aggregation: sum
  dimensions:
  - resource
  - model
- name: custom_classification_pages
  description: Custom classification pages.
  unit: page
  aggregation: sum
  dimensions:
  - resource
  - classifier
- name: custom_extraction_pages
  description: Custom extraction (and Custom Generative) pages.
  unit: page
  aggregation: sum
  dimensions:
  - resource
  - model
- name: addon_pages
  description: Add-on capability invocations (High Resolution, Font, Formula).
  unit: page
  aggregation: sum
  dimensions:
  - resource
  - addon
- name: query_field_pages
  description: Query Fields requests.
  unit: page
  aggregation: sum
  dimensions:
  - resource
- name: training_hours
  description: Custom-model training hours after first 10h free.
  unit: hour
  aggregation: sum
  dimensions:
  - resource
- name: commitment_tier
  description: Active commitment-tier subscription (custom / prebuilt / read).
  unit: month
  aggregation: sum
  dimensions:
  - resource
  - tier
principles:
- name: Visibility
  description: Use Azure Cost Management + FOCUS export; tag resources by app/team.
- name: Allocation
  description: Per-resource and per-tag allocation; leverage subscription/RG separation.
- name: Optimization
  description: Use commitment tiers above ~20K pages/mo; prefer Read over Prebuilt where layout-only is sufficient; disable unused add-ons; right-size custom-extraction usage.
- name: Accountability
  description: Assign cost-center tags; alert on anomalies via Cost Management.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
